name: "CI"

on:
  # Branch pushes are built through their pull requests; push runs only for main.
  # Version tags are built by release.yml, which calls this workflow.
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Format, static checks, race tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        run: |
          go run .
          go get .

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Release note fragments
        run: go run ./internal/cmd/release check

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: Race tests
        run: go test -race ./...

  build_and_test:
    name: Build & Test on ${{ matrix.platform.OS_NAME }}, Go ${{ matrix.go }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # min: the version in go.mod; stable: the latest release.
        go: [ min, stable ]
        platform:
          - os: windows-latest
            OS_NAME: win-x64
          - os: ubuntu-latest
            OS_NAME: linux-x64
          - os: ubuntu-24.04-arm
            OS_NAME: linux-aarch64
          - os: macos-15
            OS_NAME: osx-aarch64
        # macOS arm64 runners are scarce; the go.mod minimum is checked on Linux and Windows.
        exclude:
          - go: min
            platform:
              os: macos-15
              OS_NAME: osx-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'min' && 'go.mod' || '' }}
          cache: false

      - name: Install dependencies
        run: |
          go run .
          go get .

      # Windows finds the SDK library through PATH; Linux and macOS binaries carry an rpath to it.
      - name: Add native library to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\internal\native\graal"

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
