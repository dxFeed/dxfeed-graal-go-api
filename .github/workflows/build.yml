name: "CI"

on:
  # Branch pushes are built through their pull requests; push runs only for main.
  # Version tags are built by release.yml, which calls this workflow.
  push:
    branches: [ main ]
    # A release commit changes only the notes; release.yml builds and tests it.
    paths-ignore: [ 'ReleaseNotes.md', 'release-notes/**' ]
  pull_request:
  workflow_dispatch:
  # release.yml passes the version, so the Go stable jobs also build the tools archives.
  workflow_call:
    inputs:
      tools_version:
        description: 'Version in the tools archive names; empty to skip the archives'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    name: Format, static checks, race tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        run: |
          go run .
          go get .

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Release note fragments
        run: go run ./internal/cmd/release check

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: Race tests
        run: go test -race ./...

  build_and_test:
    name: Build & Test on ${{ matrix.platform.OS_NAME }}, Go ${{ matrix.go }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # min: the version in go.mod; stable: the latest release.
        go: [ min, stable ]
        platform:
          - os: windows-latest
            OS_NAME: win-x64
          - os: ubuntu-24.04
            OS_NAME: linux-x64
          - os: ubuntu-24.04-arm
            OS_NAME: linux-aarch64
          - os: macos-15
            OS_NAME: osx-aarch64
        # macOS arm64 runners are scarce; the go.mod minimum is checked on Linux and Windows.
        exclude:
          - go: min
            platform:
              os: macos-15
              OS_NAME: osx-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'min' && 'go.mod' || '' }}
          cache: false

      - name: Install dependencies
        run: |
          go run .
          go get .

      # Windows finds the SDK library through PATH; Linux and macOS binaries carry an rpath to it.
      - name: Add native library to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\internal\native\graal"

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      # The archives are built in the tested job, so a release waits for each runner once.
      - name: Build Tools
        if: inputs.tools_version != '' && matrix.go == 'stable'
        run: make build
        shell: bash

      - name: Zip Tools
        if: inputs.tools_version != '' && matrix.go == 'stable'
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
        with:
          type: 'zip'
          filename: tools-${{ matrix.platform.OS_NAME }}-${{ inputs.tools_version }}.zip
          directory: 'bin/'
          path: "."

      - name: Upload Tools
        if: inputs.tools_version != '' && matrix.go == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ matrix.platform.OS_NAME }}
          path: bin/tools-${{ matrix.platform.OS_NAME }}-${{ inputs.tools_version }}.zip
          if-no-files-found: error
