name: "CI"

on:
  # Branch pushes are built through their pull requests; push runs only for main.
  # Version tags are built by release.yml, which calls this workflow.
  push:
    branches: [ main ]
    # A release commit changes only the notes; release.yml builds and tests it.
    paths-ignore: [ 'ReleaseNotes.md', 'release-notes/**' ]
  pull_request:
  workflow_dispatch:
  # release.yml passes the version, so the Go stable jobs also build the tools archives.
  workflow_call:
    inputs:
      tools_version:
        description: 'Version in the tools archive names; empty to skip the archives'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  checks:
    name: Format, static checks, race tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          cache: false

      # cgo links the library from the SDK directory, and the tests load it from there.
      - name: Install the native SDK
        shell: bash
        run: |
          dir=$(go run ./cmd/install-sdk -print-dir)
          if [ "$RUNNER_OS" = Windows ]; then
            echo "CGO_LDFLAGS=-L$dir" >> "$GITHUB_ENV"
            echo "$dir" >> "$GITHUB_PATH"
          else
            echo "CGO_LDFLAGS=-L$dir -Wl,-rpath,$dir" >> "$GITHUB_ENV"
          fi
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Release note fragments
        run: go run ./internal/cmd/release check

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: Race tests
        run: go test -race ./...

  # gorelease compares the exported API with the latest release tag; an incompatible change that a pull request adds
  # needs a [BREAKING] release note fragment in it. A release checks its version instead (release.yml).
  api:
    name: API compatibility
    if: inputs.tools_version == ''
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          cache: false

      # gorelease loads the packages with cgo, as a build does.
      - name: Install the native SDK
        run: |
          dir=$(go run ./cmd/install-sdk -print-dir)
          echo "CGO_LDFLAGS=-L$dir" >> "$GITHUB_ENV"

      - name: Compare the API with the latest release
        run: go run ./internal/cmd/release api

  build_and_test:
    name: Build & Test on ${{ matrix.platform.OS_NAME }}, Go ${{ matrix.go }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # min: the version in go.mod; stable: the latest release.
        go: [ min, stable ]
        platform:
          - os: windows-latest
            OS_NAME: win-x64
          - os: ubuntu-24.04
            OS_NAME: linux-x64
          - os: ubuntu-24.04-arm
            OS_NAME: linux-aarch64
          - os: macos-15
            OS_NAME: osx-aarch64
        # macOS arm64 runners are scarce; the go.mod minimum is checked on Linux and Windows.
        exclude:
          - go: min
            platform:
              os: macos-15
              OS_NAME: osx-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'min' && 'go.mod' || '' }}
          cache: false

      # cgo links the library from the SDK directory, and the tests load it from there.
      - name: Install the native SDK
        shell: bash
        run: |
          dir=$(go run ./cmd/install-sdk -print-dir)
          if [ "$RUNNER_OS" = Windows ]; then
            echo "CGO_LDFLAGS=-L$dir" >> "$GITHUB_ENV"
            echo "$dir" >> "$GITHUB_PATH"
          else
            echo "CGO_LDFLAGS=-L$dir -Wl,-rpath,$dir" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      # The archives are built in the tested job, so a release waits for each runner once.
      - name: Build Tools
        if: inputs.tools_version != '' && matrix.go == 'stable'
        run: make build
        shell: bash

      - name: Zip Tools
        if: inputs.tools_version != '' && matrix.go == 'stable'
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
        with:
          type: 'zip'
          filename: tools-${{ matrix.platform.OS_NAME }}-${{ inputs.tools_version }}.zip
          directory: 'bin/'
          path: "."

      - name: Upload Tools
        if: inputs.tools_version != '' && matrix.go == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ matrix.platform.OS_NAME }}
          path: bin/tools-${{ matrix.platform.OS_NAME }}-${{ inputs.tools_version }}.zip
          if-no-files-found: error

  # A separate module gets the API from a module zip of this commit, as an application gets it with go get.
  # A release runs the same job against the published version (release.yml).
  consumer:
    name: Consumer
    if: inputs.tools_version == ''
    uses: ./.github/workflows/consumer.yml
